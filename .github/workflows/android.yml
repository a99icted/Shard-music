name: Android
on:
  push:
    branches: [main, 'codex/**']
    paths: ['mobile/**', 'src/**', 'assets/**', 'Cargo.toml', 'build.rs', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'src/**', 'Cargo.toml', 'build.rs', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            mobile/native
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo test --locked --no-default-features -- --test-threads=1
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: sh ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: Shard-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
